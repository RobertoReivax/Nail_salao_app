<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login - Nail Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-pink-100 to-rose-200 min-h-screen flex items-center justify-center">
<div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
    <h2 class="text-3xl font-bold text-center text-pink-600 mb-2">Nail Studio</h2>
    <p class="text-center text-gray-400 text-sm mb-6">Acesse o painel de gestão</p>
    <form method="POST" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700">Usuário</label>
            <input type="text" name="username" required class="w-full mt-1 p-3 border rounded-xl focus:ring-2 focus:ring-pink-400 outline-none" placeholder="admin">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700">Senha</label>
            <input type="password" name="password" required class="w-full mt-1 p-3 border rounded-xl focus:ring-2 focus:ring-pink-400 outline-none" placeholder="••••••••">
        </div>
        <button type="submit" class="w-full bg-pink-600 hover:bg-pink-700 text-white font-bold py-3 rounded-xl transition">Entrar</button>
    </form>
    <p class="text-xs text-center text-gray-400 mt-4">Padrão: admin / admin123</p>
</div>
</body>
</html>
